<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Everything between these two markers is rewritten per language by
         scripts/build-shells.mjs (title, description, canonical, hreflang,
         Open Graph, JSON-LD, robots). In `vite dev` it stays as is. -->
    <!-- agp:head:start -->
    <title>Genome Viewer</title>
    <meta name="description" content="" />
    <!-- agp:head:end -->
    <!-- Relative path from this shell to the app root: "./" here, "../" in /es/.
         Data and preloads are resolved against it (src/i18n/index.ts). -->
    <meta name="agp-root" content="./" />
    <meta name="color-scheme" content="light dark" />

    <!-- El catalogo completo son 978 B. Se incrusta aqui durante el build
         (scripts/inline-index.mjs); en `vite dev` se queda en `null` y el visor
         lo pide por red. Incrustarlo ahorra un viaje en la portada y, sobre
         todo, deja que el script de abajo sepa cual es la variante destacada
         sin esperar a nadie. Va ANTES del script porque un script clasico se
         ejecuta al llegar el parser: lo que necesita leer ya tiene que
         existir. -->
    <script type="application/json" id="agp-index">null</script>

    <!-- Especulacion de descarga, antes del bundle.
         Medido en 3G lento: un enlace profundo a una ficha costaba TRES oleadas
         en serie (html -> bundle -> locus.json + card.json). La tercera existia
         solo porque nadie sabia que pedir hasta que el bundle se descargaba y
         se ejecutaba. Pero la ruta de esos artefactos es CONTRATO, no dato, y
         se puede calcular leyendo `location.hash`. Aqui se calcula y se emite
         el `<link rel=preload>` mientras el bundle sigue viajando: la oleada 3
         se funde con la 2.
         Tres cosas que no son accidentales:
         - Script CLASICO, no modulo: un modulo se difiere hasta despues del
           parseo, que es justo el retraso que se quiere evitar (y Vite lo
           empaquetaria, con lo que dejaria de ser inline).
         - Los ids se validan contra [A-Za-z0-9_-]+ antes de construir la URL.
           El hash lo escribe quien visita; sin eso, un `../` pediria fuera del
           arbol de datos.
         - `crossorigin="anonymous"` se copia del `fetch()` real. Un juego de
           atributos distinto hace que el navegador descargue DOS veces y el
           preload salga contraproducente.
         Una especulacion equivocada no puede cambiar lo que se pinta: solo
         desperdicia una peticion. Por eso todo va en try/catch. -->
    <script id="agp-boot">
      (function () {
        'use strict';
        var SAFE = /^[A-Za-z0-9_-]+$/;
        var rootMeta = document.querySelector('meta[name="agp-root"]');
        var ROOT = (rootMeta && rootMeta.getAttribute('content')) || './';

        // Remembered language. Only an explicit click on the toggle stores it,
        // and only a visit to the bare home page follows it: a deep link in the
        // other language is a choice too, and crawlers never store anything.
        try {
          var chosen = localStorage.getItem('agp-lang');
          var current = document.documentElement.lang;
          var bare = !String(location.hash || '').replace(/^#\/?/, '');
          if (bare && (chosen === 'es' || chosen === 'en') && chosen !== current &&
              document.querySelector('meta[name="agp-shell"]')) {
            location.replace(chosen === 'es' ? ROOT + 'es/' : ROOT);
            return;
          }
        } catch (error) {
          // Blocked storage: stay on the language of the URL.
        }

        function preload(path) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = ROOT + path;
          document.head.appendChild(link);
        }

        // Que archivo va a pedir cada vista. Es contrato, no dato.
        // `signal` no tiene JSON propio: sus bloques .bin salen de locus.json,
        // asi que ahi no hay nada mas que adelantar por convencion.
        function artifactOf(view) {
          if (view === 'tracks') return 'tracks.json';
          if (view === 'saturation') return 'saturation.json';
          if (view === 'splice') return 'splice.json';
          // Faltaba: la vista de contactos precargaba card.json, que nunca
          // usa, y Chrome lo avisaba en consola cuando la red iba lenta.
          if (view === 'contact') return 'contacts.json';
          if (view === 'signal') return null;
          return 'card.json';
        }

        try {
          var raw = String(location.hash || '').replace(/^#\/?/, '');
          var half = raw.split('?');
          var parts = half[0].split('/').filter(Boolean);
          var query = new URLSearchParams(half[1] || '');

          // Solo la portada usa la ficha destacada. `about` la precargaba
          // tambien y Chrome avisaba de un preload sin usar (intermitente:
          // depende de cuanto tarde la pagina en asentarse).
          if (!parts.length) {
            // Portada: el catalogo ya viene incrustado. Lo unico que se puede
            // adelantar es la variante destacada, y el propio indice dice cual
            // es, para que cambiarla no obligue a tocar este script.
            // Solo `card.json`: la portada NO pide el `locus.json` de ese locus.
            // `loadCard(locusPath, relativa)` usa la primera ruta unicamente
            // para resolver el directorio, no la descarga. Adelantarlo costaba
            // 4,8 kB de ruta critica en 3G lento a cambio de nada.
            var node = document.getElementById('agp-index');
            var seed = node ? JSON.parse(node.textContent) : null;
            var featured = seed && seed.featured;
            if (!featured || !SAFE.test(featured.locus) || !SAFE.test(featured.variant)) return;
            preload(
              'data/loci/' + featured.locus + '/variants/' + featured.variant + '/card.json'
            );
            return;
          }

          // Views whose texts are not inlined need the full dictionary chunk.
          // Its URL is written by build-shells.mjs; asking for it here, next to
          // the view's artifact, keeps it off the serial chain.
          var view = query.get('view') || 'card';
          var needsFull = parts[0] === 'about' || parts[0] === 'study' ||
            (parts[0] === 'variant' && view !== 'card' && view !== 'signal');
          var fullMeta = document.querySelector('meta[name="agp-full-dict"]');
          if (needsFull && fullMeta && fullMeta.getAttribute('content')) {
            var mod = document.createElement('link');
            mod.rel = 'modulepreload';
            mod.href = ROOT + fullMeta.getAttribute('content');
            document.head.appendChild(mod);
          }

          if (parts[0] === 'about') return;

          if (parts[0] === 'study') {
            if (SAFE.test(parts[1] || '')) preload('data/studies/' + parts[1] + '/manifest.json');
            return;
          }

          if (parts[0] !== 'locus' && parts[0] !== 'variant') return;
          var locus = parts[1];
          if (!SAFE.test(locus || '')) return;
          preload('data/loci/' + locus + '/locus.json');

          if (parts[0] !== 'variant') return;
          var variant = parts[2];
          if (!SAFE.test(variant || '')) return;
          var file = artifactOf(query.get('view') || 'card');
          if (file) preload('data/loci/' + locus + '/variants/' + variant + '/' + file);
        } catch (error) {
          // Sin preloads el visor funciona igual, solo con un viaje mas. Un
          // fallo aqui no puede romper la pagina.
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

    <header class="topbar">
      <a class="topbar__brand" href="#/">
        <span class="topbar__mark" aria-hidden="true"></span>
        <span class="topbar__name" data-i18n="brand.name">Genome Viewer</span>
        <span class="topbar__unofficial" data-i18n="brand.unofficial">unofficial</span>
      </a>
      <nav class="topbar__nav" data-i18n-attr="aria-label:nav.label" aria-label="Main">
        <a class="topbar__link" href="#/" data-i18n="nav.loci">Loci</a>
        <a class="topbar__link" href="#/about" data-i18n="nav.about">About the data</a>
        <button class="topbar__button" type="button" id="tour-button" data-i18n="nav.tour">How to use it</button>
        <button
          class="topbar__button"
          type="button"
          id="theme-toggle"
          data-i18n-attr="aria-label:nav.themeLabel;title:nav.themeTitle"
          aria-label="Switch between light and dark theme"
          title="Switch theme"
          data-i18n="nav.theme"
        >Theme</button>
        <a
          class="topbar__link topbar__lang"
          id="lang-toggle"
          href="es/"
          data-i18n="nav.langToggle"
          data-i18n-attr="aria-label:nav.langToggleLabel;hreflang:meta.otherLang;lang:meta.otherLang"
          hreflang="es"
          lang="es"
        >Español</a>
      </nav>
    </header>

    <main id="main" class="main"></main>

    <footer class="footer">
      <p data-i18n="footer.terms">Results derived from AlphaGenome, subject to the AlphaGenome Output Terms of Use.</p>
      <p class="footer__quiet" data-i18n="footer.quiet">Model predictions, not experimental measurements.</p>
      <p class="footer__quiet" data-i18n="brand.disclaimer">Independent project, not affiliated with Google or Google DeepMind.</p>
    </footer>

    <!-- The ACTIVE language's dictionary, inlined per shell at build time.
         At the END of the body on purpose: the module script is deferred, so
         the dictionary is parsed long before it runs, and nothing here delays
         the parser's discovery of the bundle and the preloads in <head>.
         Measured: in <head> it pushed every request back ~150 ms on slow 3G. -->
    <script type="application/json" id="agp-i18n">null</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
