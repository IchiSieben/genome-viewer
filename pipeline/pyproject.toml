[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphagenome-platform"
version = "0.1.0"
description = "Pipeline offline que congela predicciones de AlphaGenome en artefactos estaticos."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
atlas = ["alphagenome>=0.9.0", "anndata>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
agp = "alphagenome_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
